services:
  - type: web
    name: control-personal-backend
    runtime: node
    region: oregon
    rootDir: backend
    # build: instala deps, genera el cliente de Prisma y aplica migraciones versionadas.
    # NOTA: usamos `migrate deploy` (no `db push --accept-data-loss`) para no arriesgar pérdida de datos en producción.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 24h
      - key: PORT
        value: 3001
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_PATH
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
    autoDeploy: true
